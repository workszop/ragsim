  html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 4s forwards; }
  @media print { html:not(.app-ready) body { visibility: visible; animation: none; } }

<script src="https://cdn.jsdelivr.net/npm/lucide@1.57.0/dist/umd/lucide.min.js"
  integrity="sha384-Qp5jsYqEgOGiWD8YMQ6yXIycASOePxr9mmbt+Ua0Wu1IScYxo0Pxf7o3Kx6NWJID"
  crossorigin="anonymous" async></script>
<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  /* Page gutter (user decision 2026-11-07): content ~70% of the viewport on wide screens
     (15% margin each side from ~1280px), never squeezed below 900px, 16-72px on phones/tablets.
     Every full-width band, header row, page head and footer pads its content with it. */
  --gutter: max(clamp(16px, 4vw, 72px), min(15vw, calc((100vw - 900px) / 2)));
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="edu-app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }


/* ============================================================
   App
   ============================================================ */
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--chrome-h, 140px) + 12px); }
body { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
.ic { width: 18px; height: 18px; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Top menu + step rail (sticky: it holds controls) ---- */
.edu-header { position: sticky; top: 0; z-index: 50; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; flex: none; text-decoration: none; color: var(--ink); }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.edu-app-title { margin: 0 auto 0 14px; padding-left: 14px; border-left: 1px solid var(--line-2, #d9d3c7);
  font-family: var(--font-display); font-weight: 600; font-size: 38px; letter-spacing: -.02em; line-height: 1.1;
  color: var(--ink-2, #4a4540); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
/* 38px only where the bar has room; step down so the title never truncates */
@media (min-width: 769px) and (max-width: 953px) { .edu-app-title { font-size: 30px; } }
@media (min-width: 769px) and (max-width: 897px) { .edu-app-title { font-size: 24px; } }
@media (min-width: 769px) and (max-width: 857px) { .edu-app-title { font-size: 19px; } }
@media (max-width: 640px) { .edu-app-title { font-size: 15px; margin-left: 10px; padding-left: 10px; } }
.btn-ghost { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 9px 16px; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 15px; transition: background-color .15s; }
.btn-ghost:hover { background: var(--paper-2); }
.btn-ghost[disabled] { color: var(--ink-3); cursor: not-allowed; background: var(--surface); }
.edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
.edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill);
  font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.edu-seg button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }

.rail { padding: 0 var(--gutter) 10px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.rail button { width: 100%; height: 100%; display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: var(--r-pill);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-3); font-size: 13px; font-weight: 500;
  line-height: 1.2; text-align: left; cursor: default; }
.rail button .ic { width: 15px; height: 15px; }
.rail li.done button { background: var(--paper-2); border-color: var(--paper-2); color: var(--ink); cursor: pointer; }
.rail li.done button:hover { background: var(--paper-3); border-color: var(--paper-3); }
.rail li.now button { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); font-weight: 700; cursor: pointer; }
.rail li.phase-b { }
.rail-mobile { display: none; }

/* ---- Page head ---- */
.page-head { padding: 28px var(--gutter) 32px; }
.edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }

/* ---- Section bands ---- */
.sec { padding: 48px 0 56px; border-top: 1px solid var(--line); }
.sec:nth-of-type(odd) { background: var(--paper-2); }
.sec > .wrap { padding: 0 var(--gutter); }
.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.sec-head h2 { margin: 0; }
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }

/* ---- Tones & badges ---- */
.tone-grape  { background: var(--grape-soft);  color: var(--grape-ink); }
.tone-blue   { background: var(--blue-soft);   color: var(--blue-ink); }
.tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tone-green  { background: var(--green-soft);  color: var(--green-ink); }
.tone-ink    { background: var(--ink);         color: var(--paper); }
.tone-stone  { background: var(--paper-3);     color: var(--ink); }
.badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
.badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
.badge-lg .ic { width: 24px; height: 24px; }

.group-hero { border-radius: var(--r-xl); padding: 22px 28px; display: grid; grid-template-columns: 1fr 200px; gap: 28px; align-items: center; margin-bottom: 20px; }
.group-hero .edu-overline { color: inherit; margin: 0 0 6px; }
.group-hero .lead { margin: 0; font-size: var(--body-lg); line-height: 1.5; }
.gh-num { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; }
.gh-bar { height: 10px; margin-top: 8px; border-radius: var(--r-pill); background: color-mix(in srgb, currentColor 24%, transparent); overflow: hidden; }
.gh-bar span { display: block; height: 100%; background: currentColor; border-radius: var(--r-pill); transition: width .3s; }

/* ---- Step cards ---- */
.steps { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: clip; scroll-margin-top: calc(var(--chrome-h, 140px) + 12px); }
.card.now { border-color: var(--ink); box-shadow: var(--shadow-md); }
.card-head { padding: 12px 20px; background: var(--paper-2); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card:not(.collapsed) .card-head { border-bottom: 1px solid var(--line); }
.tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tile-h h3 { margin: 0; font-size: 21px; }
.card.later .tile-h h3 { color: var(--ink-3); }
.card-body { padding: 18px 20px 20px; display: grid; gap: 14px; }
.card-body > * { margin: 0; min-width: 0; }
.why { font-size: var(--body); color: var(--ink-2); line-height: 1.55; max-width: 62rem; }
.card-foot { padding: 12px 20px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-foot .spacer { flex: 1; }
.card.now .card-foot { position: sticky; bottom: 0; z-index: 2; background: var(--surface); }
.collapsed .card-body, .collapsed .card-foot { display: none; }
.summary { font-size: var(--body-sm); color: var(--ink-2); margin: 0 0 0 auto; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.chip { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
  padding: 4px 10px; border-radius: var(--r-pill); white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 4px; }
.chip .ic { width: 13px; height: 13px; }

.edu-btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 16px;
  background: var(--yellow); color: var(--on-primary); border: none; border-radius: var(--r-pill); padding: 11px 22px;
  box-shadow: var(--shadow-primary); cursor: pointer; transition: transform .12s cubic-bezier(.32,.72,.32,1), background-color .15s; }
.edu-btn:hover { background: var(--yellow-600); }
.edu-btn:active { transform: scale(.96); }
.edu-btn[disabled] { background: var(--paper-3); color: var(--ink-2); box-shadow: none; cursor: not-allowed; transform: none; }
kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); background: var(--surface); color: var(--ink); }
.hint { font-size: var(--caption); color: var(--ink-3); }

/* ---- Step content ---- */
textarea.doc { width: 100%; min-height: 190px; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-md);
  font: 15px/1.6 var(--font-sans); color: var(--ink); background: var(--surface); resize: vertical; }
textarea.doc[readonly] { background: var(--paper-2); border-color: var(--line-2); color: var(--ink-2); }
.field-label { font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
.field { display: grid; gap: 8px; }

.chunks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(19rem, 100%), 1fr)); gap: 10px; }
.chunk { border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.chunk-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--paper-3); }
.chunk-h b { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
.chunk p { margin: 0; padding: 10px 12px 12px; font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.fid { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--ink); background: var(--paper-3); border-radius: var(--r-xs); padding: 2px 7px; white-space: nowrap; }

/* vector = 12 bars (CSS shapes, single series) */
.vec { display: inline-grid; grid-template-columns: repeat(12, 9px); gap: 3px; align-items: end; height: 34px; padding: 3px 6px;
  background: var(--paper-2); border-radius: var(--r-xs); vertical-align: middle; }
.vec i { display: block; height: max(2px, var(--h)); background: var(--ink); border-radius: 2px 2px 0 0; }
td .vec { background: transparent; }
.vec.big { grid-template-columns: repeat(12, 22px); gap: 6px; height: 90px; padding: 6px 10px; }
.vec.q i { background: var(--blue-600); }
.vec-nums { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); word-break: break-word; }

.table-card { border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; padding: 10px 14px; background: var(--paper-3); border-bottom: 1px solid var(--line-2);
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; }
tbody tr:nth-child(even) td { background: var(--paper-2); }
tbody tr:last-child td { border-bottom: none; }
td.lbl { color: var(--ink); }
td.lbl span:not(.fid) { display: block; max-width: 34rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--body-sm); color: var(--ink-2); margin-top: 2px; }
tr.qrow td { background: var(--surface); border-bottom: 1px solid var(--line-2); }
tr.qrow td.lbl { font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); color: var(--ink); white-space: nowrap; }
.meter { display: inline-block; width: 80px; height: 8px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; vertical-align: middle; margin-left: 8px; }
.meter i { display: block; height: 100%; width: var(--w); background: var(--ink); }
tr.picked td { font-weight: 600; }

details.more { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); }
details.more > summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; padding: 8px 14px; font-family: var(--font-display); font-weight: 600; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-family: var(--font-mono); }
details.more[open] > summary { border-bottom: 1px dashed var(--line-2); }
details.more[open] > summary::after { content: "−"; }
details.more > div { padding: 10px 14px; display: grid; gap: 6px; }

.questions { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { padding: 10px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); background: var(--surface); color: var(--ink);
  cursor: pointer; font-weight: 500; font-size: 15px; transition: background-color .15s; }
.opt:hover { background: var(--paper-2); }
.opt[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-ink); border-color: var(--blue-soft); }
.opt[disabled] { cursor: not-allowed; }
.opt[disabled]:not([aria-pressed="true"]) { color: var(--ink-3); background: var(--surface); }
.question { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--ink); background: var(--paper-2); border-radius: var(--r-md); padding: 12px 16px; }

.prompt { border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; }
.prompt section { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); }
.prompt section:last-child { border-bottom: none; }
.prompt .edu-overline { display: block; margin-bottom: 6px; }
.prompt p { margin: 0 0 6px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.prompt p:last-child { margin-bottom: 0; }
.prompt .sys { background: var(--paper-2); }
.prompt .empty { color: var(--ink-3); }

.chat { display: grid; gap: 10px; }
.chat .bubble { margin: 0; }
.bubble { border-radius: var(--r-lg); padding: 14px 18px; max-width: 52rem; font-size: 18px; line-height: 1.5; }
.bubble.user { background: var(--paper-3); color: var(--ink); justify-self: end; border-bottom-right-radius: var(--r-xs); }
.bubble.bot { background: var(--blue-soft); color: var(--blue-ink); border-bottom-left-radius: var(--r-xs); }
.bubble .edu-overline { display: block; color: inherit; margin-bottom: 4px; font-size: 11px; }
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.callout { border-radius: var(--r-md); padding: 12px 16px; font-size: var(--body); line-height: 1.5; }
.callout.tone-yellow { color: var(--yellow-ink); }

footer.foot { padding: 22px var(--gutter) 28px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer.foot p { margin: 0; font-size: var(--caption); color: var(--ink-3); }

/* ---- Presentation: same layout, larger type, one open card ---- */
body.present .card-body { font-size: 1.12rem; }
body.present .why { font-size: 1.2rem; }
body.present .tile-h h3 { font-size: 26px; }
body.present .chunk p { font-size: 1rem; }
body.present .bubble { font-size: 24px; }
body.present .prompt p { font-size: 16px; }
body.present .group-hero { display: none; }

@media (max-width: 1100px) {
  .rail ol { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .edu-logo { width: 44px; height: 44px; }
  .edu-wordmark { font-size: 19px; }
  .edu-header-inner { gap: 8px; padding-block: 4px; }
  .mode-seg { display: none; }
  .btn-ghost .lbl { display: none; }
  .btn-ghost { padding: 9px 11px; }
  .rail ol { display: none; }
  .rail-mobile { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .rail-mobile .gh-bar { flex: 1; margin: 0; color: var(--ink); }
  .rail-mobile .gh-bar span { background: var(--yellow); }
  .page-head { padding: 20px var(--gutter) 24px; }
  .sec { padding: 32px 0 40px; }
  .sec-head h2 { font-size: 26px; }
  .group-hero { grid-template-columns: 1fr; padding: 18px 20px; gap: 12px; }
  .card-head, .card-body, .card-foot { padding-inline: 14px; }
  .summary { display: none; }
  .tile-h h3 { font-size: 18px; }
  .vec.big { grid-template-columns: repeat(12, 1fr); gap: 4px; width: 100%; }
  td.lbl span:not(.fid) { max-width: 9rem; }
  .vcol, .meter { display: none; }
  th, td { padding: 8px 6px; }
  th { font-size: 10px; letter-spacing: .03em; }
  td.lbl span:not(.fid) { max-width: 7rem; }
  td .chip { font-size: 10px; padding: 3px 7px; letter-spacing: .03em; }
  table { font-size: 14px; }
  .bubble { font-size: 16px; }
  .card-foot .edu-btn { flex: 1; justify-content: center; white-space: nowrap; padding-inline: 16px; font-size: 15px; }
  .card-foot { flex-wrap: nowrap; }
  .card-foot .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

const DOCS = {
  pl: `Nasz Układ Słoneczny to rozległe i fascynujące miejsce, skupione wokół Słońca – gwiazdy typu G (żółty karzeł), która zawiera 99,86% całkowitej masy układu. Grawitacja Słońca utrzymuje razem wszystko – od największych planet po najmniejsze odłamki skalne. Oficjalnie wyróżnia się osiem planet. Licząc od Słońca, są to Merkury, Wenus, Ziemia i Mars – wewnętrzne, skaliste (terrestryczne) planety. Za Marsem leży główny pas asteroid – obszar zamieszkały przez miliony skalistych ciał, pozostałości z wczesnego formowania się Układu Słonecznego. Ceres, największy obiekt w pasie asteroid, sklasyfikowany jest jako planeta karłowata. Za pasem asteroid znajdują się planety zewnętrzne: Jowisz, Saturn, Uran i Neptun. Są to gazowe olbrzymy (Jowisz, Saturn) i lodowe olbrzymy (Uran, Neptun) – znacznie większe od planet terrestrycznych, zbudowane głównie z gazów i lodu. Jowisz jest zdecydowanie największą planetą, posiada silne pole magnetyczne i liczne księżyce, w tym cztery duże księżyce galileuszowe: Io, Europę, Ganimedesa i Kallisto. Saturn słynie z imponującego i złożonego systemu pierścieni, zbudowanego głównie z cząsteczek lodu z domieszką odłamków skalnych i pyłu. Ma też wiele księżyców, w tym duży Tytan z gęstą atmosferą. Uran i Neptun, lodowe olbrzymy, są chłodniejsze i mają atmosfery zawierające metan, który nadaje im niebieskawą barwę. Uran jest wyjątkowy, ponieważ obraca się na boku – prawdopodobnie wskutek ogromnego zderzenia we wczesnej historii układu. Neptun to najbardziej wietrzna planeta – w jego atmosferze szaleją naddźwiękowe burze. Za Neptunem leży Pas Kuipera – kolejny dyskowy obszar wypełniony lodowymi ciałami, w tym planetami karłowatymi: Plutonem, Eris, Makemake i Haumea. Jeszcze dalej rozciąga się teoretyczny Obłok Oorta – ogromna sferyczna powłoka lodowych obiektów, uważana za źródło długookresowych komet. Cały Układ Słoneczny jest w ciągłym ruchu – planety orbitują wokół Słońca, księżyce wokół swoich planet, a wszystko to jest częścią galaktyki Drogi Mlecznej.`,
  en: `Our Solar System is a vast and fascinating place, centred on the Sun – a G-type star (a yellow dwarf) that holds 99.86% of the system's total mass. The Sun's gravity holds everything together – from the largest planets to the smallest rocky fragments. Officially, there are eight planets. Counting from the Sun, they are Mercury, Venus, Earth and Mars – the inner, rocky (terrestrial) planets. Beyond Mars lies the main asteroid belt – a region home to millions of rocky bodies, leftovers from the early formation of the Solar System. Ceres, the largest object in the asteroid belt, is classified as a dwarf planet. Beyond the asteroid belt are the outer planets: Jupiter, Saturn, Uranus and Neptune. They are gas giants (Jupiter, Saturn) and ice giants (Uranus, Neptune) – much larger than the terrestrial planets and made mostly of gas and ice. Jupiter is by far the largest planet, with a strong magnetic field and many moons, including four large Galilean moons: Io, Europa, Ganymede and Callisto. Saturn is famous for its impressive and complex ring system, made mostly of ice particles mixed with rocky debris and dust. It also has many moons, including the large Titan with its thick atmosphere. Uranus and Neptune, the ice giants, are colder and have atmospheres containing methane, which gives them a bluish colour. Uranus is unusual because it rotates on its side – probably the result of a huge collision early in the system's history. Neptune is the windiest planet – supersonic storms rage in its atmosphere. Beyond Neptune lies the Kuiper Belt – another disc-shaped region filled with icy bodies, including the dwarf planets Pluto, Eris, Makemake and Haumea. Further still lies the theoretical Oort Cloud – a huge spherical shell of icy objects, thought to be the source of long-period comets. The whole Solar System is in constant motion – planets orbit the Sun, moons orbit their planets, and all of it is part of the Milky Way galaxy.`,

// 12 hidden topics. A stem matches the start of a word (Unicode-aware), so Polish endings
// ("Saturna", "pierścieniach") and diacritics work. Stems of 3 letters or less match whole words only.
const TOPICS = [
  ['słońc', 'gwiazd', 'karzeł', 'sun', 'star', 'yellow dwarf'],
  ['merkur', 'wenus', 'najbliż', 'licząc', 'wewnętrzn', 'terrestr', 'mercury', 'venus', 'closest', 'nearest', 'counting', 'inner'],
  ['asteroid', 'ceres', 'karłowat', 'dwarf planet'],
  ['życi', 'zwierz', 'life', 'animal'],
  ['zewnętrzn', 'olbrzym', 'gazow', 'outer', 'giant', 'gas'],
  ['jowisz', 'galileusz', 'io', 'europ', 'ganimedes', 'kallisto', 'jupiter', 'galilean', 'ganymede', 'callisto'],
  ['saturn', 'pierścien', 'pierścień', 'tytan', 'ring', 'titan'],
  ['uran', 'neptun', 'metan', 'burz', 'wietrzn', 'zderzen', 'methane', 'storm', 'wind', 'collision'],
  ['kuiper', 'oort', 'pluton', 'eris', 'komet', 'pluto', 'comet'],
  ['ruch', 'orbit', 'galakty', 'mleczn', 'motion', 'galaxy', 'milky'],
  ['planet', 'układ', 'słoneczn', 'mas', 'grawitac', 'solar', 'system', 'mass', 'gravity'],
  ['księżyc', 'moon'],
];
// Very common topics (the Sun, "planet / system") count for less, like rare words do in real search.
const TOPIC_WEIGHT = [0.6, 1, 1, 1, 1, 1, 1, 1, 1, 1, 0.35, 1];
const DIM = TOPICS.length;
const TOP_K = 3;
const MIN_SCORE = 0.35;
const SENTENCES_PER_CHUNK = 3;

// ─── Engine (deterministic: same text, same vector) ───
function words(text) { return text.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []; }
function embed(text) {
  const ws = words(text), joined = ` ${ws.join(' ')} `;
  const v = TOPICS.map((stems, d) => {
    let n = 0;
    for (const s of stems) {
      if (s.includes(' ')) n += joined.split(` ${s}`).length - 1;
      else if (s.length <= 3) n += ws.filter(w => w === s).length;
      else n += ws.filter(w => w.startsWith(s)).length;
    }
    return Math.sqrt(n) * TOPIC_WEIGHT[d];
  });
  const m = Math.hypot(...v);
  return m ? v.map(x => x / m) : v;
}
function sentences(text) { return text.trim().split(/(?<=[.!?])\s+(?=[\p{Lu}\p{N}])/u).map(s => s.trim()).filter(Boolean); }
function chunkText(text) {
  const s = sentences(text), out = [];
  for (let i = 0; i < s.length; i += SENTENCES_PER_CHUNK) out.push(s.slice(i, i + SENTENCES_PER_CHUNK).join(' '));
  return out;
}
const cosine = (a, b) => a.reduce((sum, x, i) => sum + x * b[i], 0);
function pipeline(doc, q, lang) {
  const chunks = chunkText(doc).map((text, i) => ({ id: `F${i + 1}`, text, vec: embed(text) }));
  if (!q) return { chunks };
  const qText = q.text[lang];
  const qVec = embed(qText);
  const ranked = chunks.map(c => ({ ...c, score: cosine(qVec, c.vec) })).sort((a, b) => b.score - a.score);
  ranked.forEach((c, i) => { c.rank = i + 1; c.used = i < TOP_K && c.score >= MIN_SCORE; });
  const used = ranked.filter(c => c.used);
  // Rule-based "model": answers only from the chunks that are in the prompt.
  const cited = used.filter(c => q.needs.some(re => re.test(c.text)));
  const ok = cited.length && q.needs.every(re => used.some(c => re.test(c.text)));
  const answer = !used.length ? 'noContext' : ok ? 'answer' : 'notInContext';
  return { chunks, qText, qVec, ranked, used, cited: ok ? cited : [], answer };
}

      <div class="card-head"><span class="tile-h"><span class="badge ${tone}">${ic(ICONS[i - 1])}</span><h3 id="h${i}">${L.names[i - 1]}</h3></span>${sum}${chip}</div>
      ${open ? `<div class="card-body"><p class="why">${L.why[i - 1]}</p>${body(i, P)}</div>` : ''}
      ${open && state === 'now' ? `<div class="card-foot">${foot(i, P)}</div>` : ''}</article>`;
  };
  // keep the textarea (and its caret) alive while typing on step 1
  const active = document.activeElement && document.activeElement.id === 'doc' ? document.activeElement : null;
  if (!active) document.getElementById('stepsA').innerHTML = [1, 2, 3].map(card).join('');
  document.getElementById('stepsB').innerHTML = [4, 5, 6, 7, 8].map(card).join('');
  icons(document.getElementById('chrome')); icons(document.querySelector('main'));
  if (scroll) {
    const target = document.getElementById(`step${present ? focus : S.step}`);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (target) target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
}

// ─── Actions ───
function go(step) { S.step = Math.max(1, Math.min(8, step)); S.focus = null; if (S.step < 4) S.q = null; render(true); }
function next() { const P = pipeline(S.doc, qObj(), S.lang); if (canAdvance(P)) go(S.step + 1); }
function back() { if (S.step > 1) { if (S.step === 5) S.q = null; go(S.step - 1); } }
function reset() { S.doc = DOCS[S.lang]; S.docEdited = false; S.q = null; go(1); }
function again() { S.q = null; go(4); }
function setLang(l) {
  if (l === S.lang) return;
  S.lang = l; if (!S.docEdited) S.doc = DOCS[l];
  try { localStorage.setItem('ragsim-language', l); } catch {}
  render();
}
function setMode(m) { S.mode = m; S.focus = null; try { localStorage.setItem('ragsim-mode', m); } catch {} render(true); }

document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el || el.disabled) return;
  if (el.dataset.act === 'next') next();
  else if (el.dataset.act === 'back') back();
  else if (el.dataset.act === 'again') again();
  else if (el.dataset.q) { S.q = el.dataset.q; go(5); }
  else if (el.dataset.go) {
    const n = +el.dataset.go;
    if (S.mode === 'present') { S.focus = n; render(true); }
    else document.getElementById(`step${n}`)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  else if (el.dataset.mode) setMode(el.dataset.mode);
  else if (el.dataset.lang) setLang(el.dataset.lang);
  else if (el.id === 'reset') reset();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'doc') return;
  S.doc = e.target.value; S.docEdited = S.doc !== DOCS.pl && S.doc !== DOCS.en;
  const L = t(), hint = document.getElementById('docHint');
  if (hint) hint.textContent = `${L.words(words(S.doc).length)} · ${L.sentences(sentences(S.doc).length)}`;
  const f = document.querySelector('#step1 .card-foot'); if (f) { f.innerHTML = foot(1, null); icons(f); }
});
document.addEventListener('keydown', e => {
  if (e.altKey && (e.key === 'p' || e.key === 'P' || e.code === 'KeyP')) { e.preventDefault(); setMode(S.mode === 'present' ? 'notebook' : 'present'); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight' || (e.key === 'Enter' && tag !== 'button')) { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});
const chromeObs = new ResizeObserver(() => document.documentElement.style.setProperty('--chrome-h', `${document.getElementById('chrome').offsetHeight}px`));
chromeObs.observe(document.getElementById('chrome'));
addEventListener('load', () => icons());

// test hook
window.RAG = { S, pipeline, embed, chunkText, QUESTIONS, DOCS, TOPICS, MIN_SCORE, TOP_K, go, next, back, reset, setLang, setMode };

// ─── Init ───
render();
const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
Promise.race([
  Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
  new Promise(r => setTimeout(r, 1500)),
]).then(() => document.documentElement.classList.add('app-ready'));
</script>
</body>
</html>
